<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WELMORA | Create Account</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- AOS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->
 <div id="header-placeholder">
 <a href="header.html"></a></div>
<section class="auth-section">
<div class="container">
<div class="auth-card">

<div class="auth-tabs">
<a href="login.html">Sign In</a>
<a href="register.html" class="active">Create Account</a>
</div>

<h2>Create Your Account</h2>
<p>Join Welmora for faster checkout and order tracking.</p>

<form class="contact-form" id="register-form">
<input type="text" id="ri-name" name="name" placeholder="Full name" required>
<input type="text" id="ri-business" name="businessName" placeholder="Business / organisation name" required>
<input type="text" id="ri-phone" name="phone" placeholder="Phone number" required>
<input type="text" id="ri-email" name="email" placeholder="Email address" required>
<input type="password" id="ri-password" name="password" placeholder="Password (at least 8 characters)" minlength="8" required>
<button type="submit" class="btn">Create Account</button>
<p class="form-status" id="register-status"></p>
</form>

<p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>

</div>
</div>
</section>


<!-- ================= FOOTER ================= -->
 
<div id="footer-placeholder">
 <a href="footer.html"></a></div>
<!-- Back To Top -->

<div class="back-top">

<i class="fas fa-arrow-up"></i>

</div>

<!-- ================= SCRIPTS ================= -->

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="js/include.js"></script>

<script src="js/app.js"></script>

<script>

AOS.init({

duration:1000,

once:true

});

if (document.querySelector(".heroSwiper")) {
  new Swiper(".heroSwiper", {
    loop: true,
    autoplay: { delay: 5000 },
    pagination: { el: ".swiper-pagination", clickable: true }
  });
}

</script>
<div class="chat-widget">

<button id="chatToggle">

💬

</button>

<div class="chat-box">

<div class="chat-header">

Welmora AI

</div>

<div class="chat-body">

<div class="bot-message">

Hi 👋

I'm Welmora AI.

How can I help you today?

</div>

</div>

<div class="chat-footer">

<input
id="chatInput"
placeholder="Ask anything...">

<button id="sendBtn">

Send

</button>

</div>

</div>

</div>

<script src="js/chatbot.js"></script>

<script>
  // Calls the real backend at POST /api/auth/register (see backend/routes/auth.js).
  // Passwords are securely hashed before being saved - never stored as plain text.
  const registerForm = document.getElementById("register-form");
  const statusEl = document.getElementById("register-status");

  registerForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    const formData = new FormData(registerForm);
    const payload = Object.fromEntries(formData.entries());

    statusEl.textContent = "Creating your account…";
    statusEl.className = "form-status";

    try {
      const response = await fetch("/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.message || "Could not create account");

      statusEl.textContent = "✅ " + result.message;
      statusEl.className = "form-status success";
      registerForm.reset();
      setTimeout(() => (window.location.href = "login.html"), 1500);
    } catch (err) {
      statusEl.textContent = "❌ " + err.message;
      statusEl.className = "form-status error";
    }
  });
</script>

</body>

</html>
