<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        WELMORA | Admin
    </title>


    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- AOS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/aos@2.3.4/dist/aos.css">


    <!-- Swiper -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">


    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>



<!-- =====================================================
     NAVBAR
===================================================== -->
 <div id="header-placeholder">
 <a href="header.html"></a></div>
<!-- =====================================================
     ADMIN SECTION
===================================================== -->

<section class="admin-section">

    <div class="container">


        <!-- ADD PRODUCT -->
        <div class="admin-card">


            <p
                style="
                color:var(--primary);
                font-weight:600;
                font-size:13px;
                text-transform:uppercase;
                letter-spacing:.06em;
                margin-bottom:8px;
                ">

                Admin — internal use only

            </p>


            <h2>
                Add a New Product
            </h2>


            <p
                style="
                color:var(--gray);
                font-size:14px;
                margin-bottom:24px;
                ">

                Upload a photo and fill in the details.
                New products appear on the Shop page right away.

            </p>



            <!-- PRODUCT FORM -->
            <form
                class="contact-form"
                id="product-form">


                <!-- IMAGE -->
                <label
                    class="file-drop"
                    id="drop-label"
                    for="image">


                    <img
                        id="preview-img"
                        style="display:none;">


                    <div id="drop-text">

                        Click to choose a product photo

                    </div>

                </label>


                <input
                    type="file"
                    id="image"
                    name="image"
                    accept="image/png,image/jpeg,image/webp"
                    required
                    style="display:none;">



                <!-- PRODUCT NAME -->
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Product name"
                    required>



                <!-- CATEGORY -->
                <select
                    id="category"
                    name="category"
                    required
                    style="
                    width:100%;
                    padding:14px 20px;
                    border:1px solid var(--border);
                    border-radius:50px;
                    margin-bottom:15px;
                    font-family:'Poppins',sans-serif;
                    ">

                    <option value="">
                        Select category
                    </option>

                    <option value="Menstrual Care">
                        Menstrual Health
                    </option>

                    <option value="Nutrition">
                        Nutrition
                    </option>

                    <option value="Hormonal Health">
                        Overall Wellbeing
                    </option>

                </select>



                <!-- DESCRIPTION -->
                <textarea
                    id="description"
                    name="description"
                    rows="4"
                    placeholder="Short product description"
                    required></textarea>



                <!-- PASSWORD -->
                <input
                    type="password"
                    id="adminPassword"
                    name="adminPassword"
                    placeholder="Admin password"
                    required>



                <!-- SUBMIT -->
                <button
                    type="submit"
                    class="btn"
                    id="submit-btn"
                    style="width:100%;">

                    Add Product

                </button>


                <p
                    class="form-status"
                    id="status-msg">

                </p>

            </form>

        </div>



        <!-- =================================================
             EXISTING PRODUCTS
        ================================================= -->

        <div class="existing-products">


            <h2>
                Uploaded Products
            </h2>


            <div class="table-wrapper">


                <table>


                    <thead>

                        <tr>

                            <th>
                                Image
                            </th>

                            <th>
                                Product Name
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Edit
                            </th>

                            <th>
                                Delete
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="existing-products-body">

                    </tbody>


                </table>

            </div>

        </div>

    </div>

</section>



<!-- =====================================================
     FOOTER
===================================================== -->
<div id="footer-placeholder">
 <a href="footer.html"></a></div>


<!-- =====================================================
     BACK TO TOP
===================================================== -->

<div class="back-top">

    <i class="fas fa-arrow-up"></i>

</div>



<!-- =====================================================
     CHATBOT
===================================================== -->
<a href="https://wa.me/918924016051" class="whatsapp" target="_blank">
    
<i class="fab fa-whatsapp"></i>
</a>
<div class="chat-widget">


    <button
        id="chatToggle"
        aria-label="Open Welmora AI">

        💬

    </button>


    <div class="chat-box">


        <div class="chat-header">

            Welmora AI

        </div>


        <div class="chat-body">

            <div class="bot-message">

                Hi 👋

                <br><br>

                I'm Welmora AI.

                <br>

                How can I help you today?

            </div>

        </div>


        <div class="chat-footer">

            <input
                type="text"
                id="chatInput"
                placeholder="Ask anything...">


            <button
                type="button"
                id="sendBtn">

                Send

            </button>

        </div>

    </div>

</div>



<!-- =====================================================
     SCRIPTS
===================================================== -->

<script
    src="https://unpkg.com/aos@2.3.4/dist/aos.js">
</script>


<script
    src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js">
</script>

<script src="js/include.js"></script>
<!-- ONLY ONE app.js -->
<script src="js/app.js"></script>


<script>

    AOS.init({
        duration: 1000,
        once: true
    });


    /* NEWSLETTER */

    const newsletterForm =
        document.getElementById("newsletterForm");


    if (newsletterForm) {

        newsletterForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const email =
                    document.getElementById(
                        "newsletterEmail"
                    ).value.trim();


                if (!email) {
                    return;
                }


                alert(
                    "Thank you for subscribing to WELMORA!"
                );


                newsletterForm.reset();

            }
        );

    }

</script>


<!-- CHATBOT -->
<script src="js/chatbot.js"></script>


<!-- ADMIN ONLY -->
<script src="js/admin.js"></script>


</body>

</html>
