     PAGE BANNER
===================================================== -->

<section class="page-banner">

    <div class="container">

        <h1>
            Shop All Products
        </h1>

        <p>
            Every product below is pulled live from our catalog.
            New items added through the admin page appear here automatically.
        </p>

    </div>

</section>



<!-- =====================================================
     PRODUCTS
===================================================== -->

<section class="products">

    <div class="container">


        <!-- SEARCH -->
        <div class="shop-top-bar">

            <input
                type="text"
                id="searchProduct"
                placeholder="Search products..."
                autocomplete="off">

        </div>


        <!-- FILTERS -->
        <div
            class="shop-filters"
            id="shop-filters">

            <button
                class="shop-filter-btn active"
                data-cat="All">

                All

            </button>


            <button
                class="shop-filter-btn"
                data-cat="Menstrual Care">

                Menstrual Health

            </button>


            <button
                class="shop-filter-btn"
                data-cat="Nutrition">

                Nutrition

            </button>


            <button
                class="shop-filter-btn"
                data-cat="Hormonal Health">

                Overall Wellbeing

            </button>

        </div>


        <!-- PRODUCT GRID -->
        <div
            class="product-grid"
            id="shop-grid">

            <!-- Products generated by shop.js -->

        </div>

    </div>

</section>


<div><center><a href="admin.html">Welmora</a></center></div>
<!-- =====================================================
     FOOTER
===================================================== -->

<div id="footer-placeholder">
 <a href="footer.html"></a></div>

===================================================== -->

</div>



<!-- =====================================================
     CHATBOT
===================================================== -->

<div class="chat-widget">

    <button id="chatToggle"
        aria-label="Open Welmora AI">

        💬

    </button>


    <div class="chat-box">


        <div class="chat-header">

            Welmora AI

        </div>


        <div class="chat-body">

            <div class="bot-message">

                Hi 👋

                <br><br>

                I'm Welmora AI.

                <br>

                How can I help you today?

            </div>

        </div>


        <div class="chat-footer">

            <input
                type="text"
                id="chatInput"
                placeholder="Ask anything...">


            <button
                type="button"
                id="sendBtn">

                Send

            </button>

        </div>

    </div>

</div>



<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


<!-- ONLY ONE app.js -->
<script src="js/app.js"></script>
<script src="js/include.js"></script>


<script>

    AOS.init({
        duration: 500,
        once: true
    });


    if (document.querySelector(".heroSwiper")) {

        new Swiper(".heroSwiper", {

            loop: true,

            autoplay: {
                delay: 5000
            },

            pagination: {
                el: ".swiper-pagination",
                clickable: true
            }

        });

    }


    /* NEWSLETTER */

    const newsletterForm =
        document.getElementById("newsletterForm");


    if (newsletterForm) {

        newsletterForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const email =
                    document.getElementById(
                        "newsletterEmail"
                    ).value.trim();


                if (!email) {
                    return;
                }


                alert(
                    "Thank you for subscribing to WELMORA!"
                );


                newsletterForm.reset();

            }
        );

    }

</script>
